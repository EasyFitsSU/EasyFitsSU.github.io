<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light">
	<title>EasyFits | Project Description</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">

<body>

<!-- Menu button, only visible on phones (the side navigation opens on hover elsewhere) -->
<button type="button" class="sn-fab" id="sn-fab" aria-label="Open menu" aria-controls="tabs" aria-expanded="false">
	<span></span><span></span><span></span>
</button>

<!-- Side navigation. To add a tab: copy a link + sections pair here, add it to the TABS array in js/main.js,
     and create a folder in components/. The sections under the active tab are filled in by js/main.js. -->
<nav class="sidenav" id="tabs" aria-label="Milestones">
	<a href="#m1" data-tab="m1"><span class="sn-badge">M1</span><span class="sn-label">Milestone 1</span></a>
	<div class="sn-sections" data-for="m1"></div>
	<a href="#m2" data-tab="m2"><span class="sn-badge">M2</span><span class="sn-label">Milestone 2</span></a>
	<div class="sn-sections" data-for="m2"></div>
</nav>

<header class="hero">
	<div class="wrap">
		<div>
			<h1>EasyFits</h1>
		</div>
		<svg class="fig" viewBox="0 0 200 260" role="img" aria-label="Dress form surrounded by a 360 degree ring">
			<defs><clipPath id="ring-front"><rect x="0" y="112" width="200" height="60"/></clipPath></defs>
			<ellipse class="ring back" cx="100" cy="112" rx="88" ry="22"/>
			<path class="body fill" d="M100 30c-8 0-12 6-12 14 0 6 3 9 3 12-14 4-38 10-44 22-2 4 0 8 4 10l20-4c0 30-4 52-6 70 10 6 26 9 35 9s25-3 35-9c-2-18-6-40-6-70l20 4c4-2 6-6 4-10-6-12-30-18-44-22 0-3 3-6 3-12 0-8-4-14-12-14z"/>
			<path class="body" d="M100 176v56M72 238h56"/>
			<ellipse class="ring" clip-path="url(#ring-front)" cx="100" cy="112" rx="88" ry="22"/>
			<text x="100" y="256" text-anchor="middle">360°</text>
		</svg>
	</div>
</header>
<div class="tape" aria-hidden="true"></div>

<!-- The active tab's component (components/*.html) is injected here -->
<main id="view" aria-live="polite">
	<noscript><div class="wrap"><p>This page needs JavaScript enabled to load its content.</p></div></noscript>
</main>

<footer><div class="wrap">EasyFits &middot; Team name &middot; 2026</div></footer>

<script src="components/m2/m2.js"></script>
<script src="js/main.js"></script>
</body>
</html>
