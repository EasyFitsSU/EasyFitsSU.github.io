r"><span class="sub" style="font-size:13px">Tags:</span><button class="chip on" style="height:32px">Summer ×</button><button class="chip on" style="height:32px">Casual ×</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px"><div class="ph" style="height:150px">3D item 1</div><div class="ph" style="height:150px">3D item 2</div><div class="ph" style="height:150px">3D item 3</div><div class="ph" style="height:150px">3D item 4</div><div class="ph" style="height:150px">3D item 5</div><div class="ph" style="height:150px">3D item 6</div></div><div class="nav"><button class="tab on"><div class="ic"></div>Home</button><button class="tab"><div class="ic"></div>Suggestions</button><button class="tab"><div class="ic"></div>Scan</button><button class="tab"><div class="ic"></div>Outfits</button><button class="tab"><div class="ic"></div>Shop</button></div></div></div></div></figure><figure class="item"><figcaption>4 Wardrobe filters</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between;align-items:center"><button class="chip">Close</button><h3 style="font-size:16px">Filters</h3><button class="chip">Clear all</button></div><h2 style="font-size:18px;margin-top:28px">Tags</h2><p class="sub" style="font-size:13px;margin-top:4px">Show only items with these tags.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="chip on">Summer</button><button class="chip on">Casual</button><button class="chip">Winter</button><button class="chip">Formal</button><button class="chip">Party</button><button class="chip">Work</button><button class="chip">Sport</button><button class="chip">Cozy</button></div><h2 style="font-size:18px;margin-top:28px">Match</h2><div style="display:flex;gap:8px;margin-top:12px"><button class="chip on" style="flex:1">Any tag</button><button class="chip" style="flex:1">All tags</button></div><div style="flex:1"></div><button class="btn" style="margin-bottom:32px">Show 8 items</button></div></div></div></figure><figure class="item"><figcaption>5 Item detail</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between"><button class="chip">Back</button><button class="chip">Edit</button></div><div class="ph" style="height:220px;margin-top:16px">Rotatable 3D item<br>Drag to rotate</div><h1 style="font-size:24px;margin-top:16px">Item name</h1><p class="sub" style="margin-top:4px">Tops &#183; Size M</p><p class="sub" style="margin-top:2px">Tags: Casual, Summer</p><h3 style="font-size:16px;margin-top:20px">Goes with</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"><div><div class="ph" style="height:76px">Item A</div><p class="sub" style="font-size:11px;margin-top:4px;line-height:1.3">Paired 6 times</p></div><div><div class="ph" style="height:76px">Item B</div><p class="sub" style="font-size:11px;margin-top:4px;line-height:1.3">Paired 4 times</p></div><div><div class="ph" style="height:76px">Item C</div><p class="sub" style="font-size:11px;margin-top:4px;line-height:1.3">We think this matches</p></div></div><p class="sub" style="font-size:12px;margin-top:8px">Based on your outfits and style rules.</p><div style="flex:1"></div><button class="btn">Try on my model</button><button class="btn2" style="margin:12px 0 32px">Add to outfit</button></div></div></div></figure><figure class="item"><figcaption>6 Edit item</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between;align-items:center"><button class="chip">Cancel</button><h3 style="font-size:16px">Edit item</h3><button class="chip on">Save</button></div><div class="ph" style="height:150px;margin-top:16px">3D item preview</div><div style="margin-top:16px"><div><label class="lbl" for="en">Name</label><input class="in" id="en" aria-label="Name" placeholder="Item name"></div></div><span class="lbl" style="margin-top:16px">Category</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip on">Tops</button><button class="chip">Bottoms</button><button class="chip">Shoes</button><button class="chip">Coats</button></div><span class="lbl" style="margin-top:16px">Tags</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip on">Casual ×</button><button class="chip on">Summer ×</button><button class="chip">+ Add tag</button></div><div style="margin-top:16px"><div><label class="lbl" for="es">Size</label><input class="in" id="es" aria-label="Size" placeholder="M"></div></div><div style="flex:1"></div><button class="btn2" style="margin-bottom:32px">Delete item</button></div></div></div></figure><figure class="item"><figcaption>7 Suggestions</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><p class="sub">Good morning</p><h1 style="font-size:26px;margin-top:4px">What are we wearing today?</h1></div></div><div class="card" style="margin-top:20px;padding:12px"><div class="ph" style="height:200px">3D model wearing today’s suggested outfit</div><h3 style="font-size:16px;margin-top:12px">Today’s suggestion</h3><p class="sub" style="font-size:13px">Placeholder: outfit name and why it works</p></div><h3 style="font-size:16px;margin-top:24px">More ideas</h3><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px"><div class="ph" style="height:120px">Outfit 1</div><div class="ph" style="height:120px">Outfit 2</div><div class="ph" style="height:120px">Outfit 3</div></div><div class="card" style="margin-top:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><div><h3 style="font-size:15px">Style guide</h3><p class="sub" style="font-size:13px">Color combinations and tips</p></div><span aria-hidden="true" style="font-size:20px">›</span></div><div class="nav"><button class="tab"><div class="ic"></div>Home</button><button class="tab on"><div class="ic"></div>Suggestions</button><button class="tab"><div class="ic"></div>Scan</button><button class="tab"><div class="ic"></div>Outfits</button><button class="tab"><div class="ic"></div>Shop</button></div></div></div></div></figure><figure class="item"><figcaption>8 Style guide</figcaption><div class="slot"><div class="phone"><div class="p"><button class="chip" style="width:64px">Back</button><h1 style="font-size:28px;margin-top:16px">Style guide</h1><p class="sub" style="margin-top:8px">Color combinations to get you started.</p><div style="display:flex;flex-direction:column;gap:12px;margin-top:20px"><div class="card" style="padding:14px"><h3 style="font-size:15px">Navy + cream + tan</h3><div style="display:flex;gap:8px;margin-top:10px"><div class="sw" style="background:#1f2a44"></div><div class="sw" style="background:#f3ead8"></div><div class="sw" style="background:#c9a27a"></div></div></div><div class="card" style="padding:14px"><h3 style="font-size:15px">Olive + white + brown</h3><div style="display:flex;gap:8px;margin-top:10px"><div class="sw" style="background:#6b7340"></div><div class="sw" style="background:#ffffff;border:1px solid #ccc"></div><div class="sw" style="background:#6a4b36"></div></div></div><div class="card" style="padding:14px"><h3 style="font-size:15px">Black + gray + red</h3><div style="display:flex;gap:8px;margin-top:10px"><div class="sw" style="background:#1a1a1a"></div><div class="sw" style="background:#9a9a9a"></div><div class="sw" style="background:#c0392b"></div></div></div></div><h3 style="font-size:16px;margin-top:20px">Tips</h3><p class="sub" style="font-size:13px;margin-top:6px">Placeholder: short static recommendations.</p></div></div></div></figure><figure class="item"><figcaption>9 Outfits</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-size:28px">Outfits you created</h1><button class="chip on">+ New</button></div><div style="display:flex;gap:8px;margin:16px -24px 0;padding:0 24px;overflow-x:auto;scrollbar-width:none;flex:none"><button class="chip on">All</button><button class="chip">Casual</button><button class="chip">Work</button><button class="chip">Party</button><button class="chip">Sport</button><button class="chip">Summer</button><button class="chip">Winter</button></div><div style="flex:1;min-height:0;overflow-y:auto;margin:12px -24px 0;padding:0 24px 100px;scrollbar-gutter:stable both-edges;scrollbar-width:thin"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><div class="ph" style="height:170px">Outfit 1</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 2</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 3</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 4</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 5</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 6</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 7</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div><div><div class="ph" style="height:170px">Outfit 8</div><p style="font-size:13px;font-weight:600;margin-top:6px">Outfit name</p></div></div></div><div class="nav"><button class="tab"><div class="ic"></div>Home</button><button class="tab"><div class="ic"></div>Suggestions</button><button class="tab"><div class="ic"></div>Scan</button><button class="tab on"><div class="ic"></div>Outfits</button><button class="tab"><div class="ic"></div>Shop</button></div></div></div></div></figure><figure class="item"><figcaption>10 Outfit builder</figcaption><div class="slot"><div class="phone"><div class="p"><div style="display:flex;justify-content:space-between"><button class="chip">Back</button><button class="chip on">Save outfit</button></div><div class="ph" style="height:240px;margin-top:16px">3D model wearing the outfit</div><div style="display:flex;align-items:center;gap:6px;margin-top:16px"><button class="chip on" style="flex:1;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:11px">1</span><span>Tops</span></button><span aria-hidden="true" style="color:#555;font-size:16px">›</span><button class="chip" style="flex:1;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:11px">2</span><span>Bottoms</span></button><span aria-hidden="true" style="color:#555;font-size:16px">›</span><button class="chip" style="flex:1;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:11px">3</span><span>Shoes</span></button><span aria-hidden="true" style="color:#555;font-size:16px">›</span><button class="chip" style="flex:1;height:52px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:11px">4</span><span>Coats</span></button></div><p class="sub" style="font-size:13px;margin-top:12px">Step 1 of 4: choose one top, or skip it</p><div style="flex:1;min-height:0;overflow-y:auto;margin:8px -24px 0;padding:0 24px 16px;scrollbar-gutter:stable both-edges;scrollbar-width:thin"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div class="ph" style="height:96px;background:#fff">No top</div><div class="ph" style="height:96px">Item 1</div><div class="ph" style="height:96px">Item 2</div><div class="ph" style="height:96px;border:3px so
